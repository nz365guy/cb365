name: Release

on:
  push:
    tags:
      - "v*"
  # A dispatch trigger exists so Auto-tag can start this build explicitly.
  # GitHub suppresses workflow runs raised by the repository GITHUB_TOKEN, so a
  # tag created with that token never starts this workflow on its own; a
  # workflow_dispatch event is the documented exception and always creates a run.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required for cosign keyless signing

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "v2.17.0"
          # The managed provider is memory-heavy; serialize platform builds so a
          # hosted runner cannot be OOM-killed by six concurrent Go compilers.
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
