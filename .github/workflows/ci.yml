name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'

      - name: Build
        run: go build -v ./cmd/cb365/

      - name: Cross-compile release targets (CGO_ENABLED=0)
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "build $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/cb365/
            done
          done

      - name: Test
        run: go test -v ./...

      - name: Vet
        run: go vet ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'

      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: gosec
        run: gosec ./...

      - name: govulncheck
        run: govulncheck ./...
