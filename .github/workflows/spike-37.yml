name: spike-37-gates

# CI evidence for cb365 #42 (ADR-0057 pre-implementation gates): the pinned
# Bitwarden Go SDK v2 must build and link with CGO_ENABLED=1, and the
# fail-closed stub must compile with CGO_ENABLED=0. Runs only when the spike
# changes; the spike module is isolated from the cb365 release build.
on:
  push:
    branches: [main]
    paths: ['docs/plan/37-bws-delegated-cache/**']
  pull_request:
    branches: [main]
    paths: ['docs/plan/37-bws-delegated-cache/**']

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/plan/37-bws-delegated-cache/spike
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: docs/plan/37-bws-delegated-cache/spike/go.sum

      - name: Verify pinned dependencies
        run: |
          go mod download
          go mod verify

      - name: 'Gate 2 variant 1: CGO_ENABLED=1 build + link probe'
        run: |
          CGO_ENABLED=1 go build -o /tmp/buildprobe-cgo ./cmd/buildprobe
          /tmp/buildprobe-cgo | tee /tmp/probe-cgo.out
          grep -q 'cgo_provider_available: true' /tmp/probe-cgo.out
          grep -q 'provider_construct: ok' /tmp/probe-cgo.out

      - name: 'Gate 2 variant 2: CGO_ENABLED=0 fail-closed stub'
        run: |
          CGO_ENABLED=0 go build -o /tmp/buildprobe-nocgo ./cmd/buildprobe
          /tmp/buildprobe-nocgo | tee /tmp/probe-nocgo.out
          grep -q 'cgo_provider_available: false' /tmp/probe-nocgo.out
          grep -q 'managed delegated authentication unavailable on this build' /tmp/probe-nocgo.out

      - name: Vet (both variants)
        run: |
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=0 go vet ./...

      - name: JWT sentinel scan over spike artefacts
        working-directory: docs/plan/37-bws-delegated-cache
        run: |
          sentinel='e''yJ'
          if grep -R --binary-files=without-match -n "$sentinel" .; then
            echo 'SENTINEL FAILURE: JWT prefix found in spike artefacts'; exit 1
          fi
          echo 'sentinel: clean'
